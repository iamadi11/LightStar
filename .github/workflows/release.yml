name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build DMG
    runs-on: macos-15
    permissions:
      contents: write
    env:
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
      HAS_SELF_CERT: ${{ secrets.APPLE_SELF_CERT != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Compute version
        id: version
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          MARKETING="${GITHUB_REF_NAME#v}"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "ci" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "ci" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "ci" "$KEYCHAIN_PATH"

      - name: Import self-signed certificate
        if: env.HAS_CERT != 'true' && env.HAS_SELF_CERT == 'true'
        env:
          SELF_CERT_BASE64: ${{ secrets.APPLE_SELF_CERT }}
          SELF_CERT_PASS: ${{ secrets.APPLE_SELF_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/self.keychain"
          CERT_PATH="$RUNNER_TEMP/self-cert.p12"
          echo "$SELF_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "ci" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "ci" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$SELF_CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "ci" "$KEYCHAIN_PATH"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ env.HAS_CERT == 'true' && 'Developer ID Application' || '' }}
        with:
          tauriScript: npm run tauri
          args: --bundles dmg,app
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: LightStar ${{ steps.version.outputs.marketing }} (${{ steps.version.outputs.sha }})
          releaseBody: |
            **Commit:** ${{ github.sha }}

            ## Install

            1. Download the `.dmg` below and open it
            2. Drag **LightStar.app** to **Applications**, or double-click **Install LightStar.command** if present
            3. If Gatekeeper blocks the app: `xattr -rd com.apple.quarantine /Applications/LightStar.app`
            4. On first launch grant **Bluetooth**. Grant **Screen Recording** / **Microphone** when you enable those sync modes.

            TCC grants follow the bundle id `com.adityaraj.LightStar` and the signing identity.
          releaseDraft: false
          prerelease: false

      - name: Delete keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
          security delete-keychain "$RUNNER_TEMP/self.keychain" 2>/dev/null || true
