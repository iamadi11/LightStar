name: Release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release
    runs-on: macos-15
    permissions:
      contents: write

    # Hoist secret existence checks to env — secrets.* in if: conditions is
    # rejected by GitHub's workflow validator since late 2024.
    env:
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so git rev-list --count HEAD gives real commit count

      # ── Xcode version ────────────────────────────────────────────────────────
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      # ── Version from git ─────────────────────────────────────────────────────
      # Tag format: v1.2.3  → marketing version 1.2.3, build = commit count
      - name: Compute version
        id: version
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          COMMIT_COUNT=$(git rev-list --count HEAD)
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          MARKETING="${LATEST_TAG#v}"
          MARKETING="${MARKETING:-0.0.1}"
          echo "marketing=$MARKETING"  >> "$GITHUB_OUTPUT"
          echo "build=$COMMIT_COUNT"   >> "$GITHUB_OUTPUT"
          echo "sha=$SHORT_SHA"        >> "$GITHUB_OUTPUT"
          echo "tag=build-$COMMIT_COUNT-$SHORT_SHA" >> "$GITHUB_OUTPUT"

      # ── Code signing (Developer ID) ──────────────────────────────────────────
      # Set up these secrets in Settings → Secrets → Actions:
      #   APPLE_CERTIFICATE          — base64-encoded Developer ID Application .p12
      #   APPLE_CERTIFICATE_PASSWORD — passphrase for the .p12
      #   APPLE_TEAM_ID              — 10-char team ID (e.g. ABC123DEF4)
      # Leave secrets empty to build unsigned (works for personal use / testing).
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "ci" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "ci" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "ci" "$KEYCHAIN_PATH"

      # ── Archive ──────────────────────────────────────────────────────────────
      - name: Archive (signed)
        if: env.HAS_CERT == 'true'
        run: |
          xcodebuild archive \
            -project LightStar.xcodeproj \
            -scheme LightStar \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/LightStar.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application"

      - name: Archive (unsigned)
        if: env.HAS_CERT != 'true'
        run: |
          xcodebuild archive \
            -project LightStar.xcodeproj \
            -scheme LightStar \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/LightStar.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # ── Export .app ──────────────────────────────────────────────────────────
      - name: Write export options (signed)
        if: env.HAS_CERT == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
          </dict>
          </plist>
          PLIST

      - name: Export .app (signed)
        if: env.HAS_CERT == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LightStar.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Copy .app (unsigned)
        if: env.HAS_CERT != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          cp -R "$RUNNER_TEMP/LightStar.xcarchive/Products/Applications/LightStar.app" \
                "$RUNNER_TEMP/export/LightStar.app"

      # ── Notarize ─────────────────────────────────────────────────────────────
      # Secrets needed:
      #   APPLE_ID           — your Apple ID email
      #   APPLE_APP_PASSWORD — app-specific password (appleid.apple.com)
      - name: Notarize
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/export/LightStar.app" \
            "$RUNNER_TEMP/LightStar-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/LightStar-notarize.zip" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/export/LightStar.app"

      # ── Package DMG (tag pushes only) ────────────────────────────────────────
      # Staged layout:
      #   LightStar.app          ← the app
      #   Applications           ← symlink to /Applications (drag-to-install)
      #   Install LightStar.command ← double-clickable script that strips
      #                              quarantine + copies to /Applications + opens
      - name: Create DMG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE"

          # App bundle
          cp -R "$RUNNER_TEMP/export/LightStar.app" "$STAGE/LightStar.app"

          # Applications symlink for drag-to-install
          ln -s /Applications "$STAGE/Applications"

          # Double-clickable installer: strips quarantine, copies to /Applications, opens
          cp ".github/install-lightstar.command" "$STAGE/Install LightStar.command"
          chmod +x "$STAGE/Install LightStar.command"

          DMG_NAME="LightStar-${{ steps.version.outputs.marketing }}-${{ steps.version.outputs.sha }}.dmg"
          DMG_PATH="$RUNNER_TEMP/$DMG_NAME"
          hdiutil create -volname "LightStar ${{ steps.version.outputs.marketing }}" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      # ── GitHub Release (tag pushes only) ────────────────────────────────────
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "LightStar ${{ steps.version.outputs.marketing }} (${{ steps.version.outputs.sha }})"
          body: |
            **Commit:** ${{ github.sha }}

            ## Install

            1. Download the `.dmg` below and open it
            2. **Easy install (recommended):** double-click **"Install LightStar.command"** — strips Gatekeeper quarantine, copies to `/Applications`, and launches automatically
               - macOS will ask "Are you sure you want to open this Terminal script?" → click **Open**
            3. **Manual install:** drag **LightStar.app** → **Applications** folder, then run in Terminal:
               ```
               xattr -rd com.apple.quarantine /Applications/LightStar.app
               ```
            4. On first launch grant **Bluetooth** permission when prompted
            5. Grant **Screen Recording** the first time you enable Video or Audio sync

            > **Updating from an older version?** Always use the install script — it resets stale permission entries before installing. macOS ties unsigned-app permissions to the binary hash, so a new build looks like a new app and permissions must be re-granted. The install script handles this automatically and tells you exactly which prompts to expect.

            > **Note:** This build is unsigned. The install script handles Gatekeeper automatically. To permanently fix the permission re-grant issue add `APPLE_CERTIFICATE` / `APPLE_CERTIFICATE_PASSWORD` / `APPLE_TEAM_ID` secrets to this repo for Developer ID signing.
          draft: false
          prerelease: false
          files: ${{ env.DMG_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Cleanup keychain ─────────────────────────────────────────────────────
      - name: Delete keychain
        if: ${{ always() && env.HAS_CERT == 'true' }}
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" || true
