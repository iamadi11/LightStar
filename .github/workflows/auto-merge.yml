name: Auto-merge

# Merges PRs into main once their CI passes, and keeps them moving when CI
# never ran: GitHub's macOS arm64 runners are often short, and a job that no
# runner picks up ends red with no step executed. See .github/scripts/sweep-prs.sh.
#
# - CI finishing (any result): merge if green, re-run if it never got a runner.
# - Every 20 minutes: the same sweep, for anything an event missed.
# - Manually from the Actions tab.
#
# workflow_run and schedule both run this file as it is on main.
# Merges made with GITHUB_TOKEN don't start other workflows, so CI doesn't
# re-run on main afterwards; the PR's CI already tested the merge result.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/scripts
      - name: Merge green PRs, re-run CI that never got a runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: .github/scripts/sweep-prs.sh
