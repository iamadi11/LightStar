[package]
name = "lightstar-core"
version = "1.0.0"
edition = "2021"
description = "BC/55 protocol, hue LUT, write coalescer, and schedules for LightStar"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1"
